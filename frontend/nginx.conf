# Nginx serve os arquivos estáticos do React e repassa /api para o container da API.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy reverso: o navegador chama /api/... no mesmo domínio (sem CORS); o Nginx repassa para "api:8080".
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health check da API (usado pela página "Sobre")
    location = /health {
        proxy_pass http://api:8080;
    }

    # SPA: qualquer rota desconhecida (ex.: /chamados) devolve o index.html e o React Router resolve.
    location / {
        try_files $uri /index.html;
    }
}
