# =====================================================================
# docker compose up --build
#   Frontend  -> http://localhost:3000
#   API       -> http://localhost:5000/swagger
#   Health    -> http://localhost:5000/health
#   SQL Server-> localhost,1433  (usuário sa / senha abaixo)
#
# Compose = sobe VÁRIOS containers juntos, com rede privada entre eles.
# Dentro da rede, um serviço acha o outro pelo NOME (ex.: a API conecta em "sqlserver").
# Em produção isso seria feito por Kubernetes (AKS/EKS) ou App Service/ECS.
# =====================================================================
services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: servicehub-sqlserver
    restart: unless-stopped   # volta sozinho quando o Docker/PC reinicia
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ServiceHub@2026!"     # apenas para desenvolvimento
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql          # dados persistem mesmo se o container for recriado
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: backend/ServiceHub.Api/Dockerfile
    container_name: servicehub-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      # Variável de ambiente sobrescreve o appsettings.json. "__" (dois underscores) = ":" (nível do JSON).
      # Equivalente ao SPRING_DATASOURCE_URL sobrescrevendo spring.datasource.url.
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ServiceHub;User Id=sa;Password=ServiceHub@2026!;TrustServerCertificate=True"
      Jwt__Chave: "chave-do-docker-compose-com-mais-de-32-caracteres!"
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: servicehub-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  sqlserver-data:
